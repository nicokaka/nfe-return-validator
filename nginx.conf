server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Mapeamento rigoroso de MIME Types para ES Modules e Javascript
    include /etc/nginx/mime.types;
    types {
        application/javascript js mjs;
        text/css css;
        text/html html;
        image/svg+xml svg;
        application/json json;
        application/pdf pdf;
    }

    # Compressão Gzip para carregamento instantâneo
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Suporte a SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Headers e Cache para scripts, workers e imagens
    location ~* \.(?:ico|css|js|mjs|gif|jpe?g|png|woff2?|eot|ttf|svg|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }
}
