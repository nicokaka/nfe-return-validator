worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    types {
        application/javascript js mjs;
        text/css css;
        text/html html;
        image/svg+xml svg;
        application/json json;
        application/pdf pdf;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # 1. Proxy reverso prioritário com ^~ para a API Integradora Oracle Pirâmide (Node.js porta 3001)
        location ^~ /api/piramide {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 15s;
        }

        # 2. Headers e Cache para scripts, workers e imagens (se não encontrar, retorna 404 em vez de index.html)
        location ~* \.(?:ico|css|js|mjs|gif|jpe?g|png|woff2?|eot|ttf|svg|pdf)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin "*";
            try_files $uri =404;
        }

        # 3. Suporte a SPA (Single Page Application) - Fallback para rotas normais do frontend
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
