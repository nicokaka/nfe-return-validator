version: '3.8'

services:
  validador-fiscal:
    build: .
    container_name: validador-fiscal-app
    ports:
      - "5002:80"
    environment:
      - ORACLE_CONNECT_STRING=192.168.97.58:1521/TESTE
      - ORACLE_USER=PIRAMIDE
      - ORACLE_PASSWORD=${ORACLE_PASSWORD:-PIRAMIDE}
      - ORACLE_SISTEMA_ORIGEM=VAL
      - PORT=3001
    restart: always
